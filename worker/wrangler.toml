name = "mollypaw-relay-room"
main = "src/index.js"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

# Durable Object 命名空间。
# new_sqlite_classes 是免费版必须的写法（2025-04-07 起 DO 进 Workers 免费版）。
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RelayRoom"]

[durable_objects]
bindings = [
  { name = "RELAY_ROOM", class_name = "RelayRoom" }
]

[observability]
enabled = true
